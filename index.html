<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Roundabout Rush: a side-scrolling, momentum-based cycling game.">
<style>*,*::before,*::after{box-sizing:border-box} body{margin:0} [hidden]{display:none!important}</style>
<title>Roundabout Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=IBM+Plex+Mono:wght@400;600&family=Press+Start+2P&display=swap">
<style>
/* Layout: one-screen race console. Title strip, full-width canvas, key legend below. Single dusk look by choice. */
:root {
  --night: #1b2230;
  --slate: #2a3446;
  --amber: #f2a541;
  --rust: #c8553d;
  --chalk: #eef0ea;
  --muted: #9aa3b2;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night); color: var(--chalk); font-family: var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  box-sizing: border-box;
}
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 12px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-style: italic; font-weight: 800; font-size: clamp(28px, 5vw, 44px); letter-spacing: .01em; margin: 0; line-height: 1; text-transform: uppercase; }
h1 span { color: var(--amber); }
.tag { color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.stage { position: relative; width: 100%; border-radius: 6px; overflow: hidden; border: 1px solid var(--slate); }
canvas { display: block; width: 100%; outline: none; touch-action: none; }
canvas:focus-visible { box-shadow: inset 0 0 0 2px var(--amber); }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.key { display: flex; gap: 10px; align-items: center; padding: 10px 12px; background: var(--slate); border-radius: 4px; font-size: 13px; line-height: 1.35; border: 0; color: var(--chalk); font-family: var(--mono); text-align: left; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; }
.key.on { background: #3a4760; }
.key:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.cap { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--muted); border-radius: 5px; font-size: 16px; color: var(--amber); }
.key b { display: block; font-family: var(--display); font-style: italic; font-size: 17px; letter-spacing: .04em; text-transform: uppercase; }
.key small { color: var(--muted); font-size: 12px; }
.head-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.tbtn { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--chalk); background: var(--slate); border: 1px solid var(--muted); border-radius: 4px; padding: 6px 10px; cursor: pointer; }
.tbtn[aria-pressed="false"] { color: var(--muted); }
.tbtn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Roundabout <span>Rush</span></h1>
    <div class="head-right">
      <div class="tag">Prototype · 2 levels</div>
      <button class="tbtn" id="menuBtn">☰ Menu (Esc)</button>
      <button class="tbtn" id="music" aria-pressed="true">♪ Music on (M)</button>
    </div>
  </header>
  <div class="stage"><canvas id="game" tabindex="0" aria-label="Cycling game. Use arrow keys."></canvas></div>
  <div class="legend">
    <button class="key" id="k-right" data-k="ArrowRight"><span class="cap">→</span><span><b>Pedal</b><small>Move forward along the course</small></span></button>
    <button class="key" id="k-up" data-k="ArrowUp"><span class="cap">↑</span><span><b>Stand &amp; attack</b><small>More power, burns energy. Empty bar = bonk</small></span></button>
    <button class="key" id="k-down" data-k="ArrowDown"><span class="cap">↓</span><span><b>Tuck</b><small>Less drag on flats and descents</small></span></button>
    <button class="key" id="k-left" data-k="ArrowLeft"><span class="cap">←</span><span><b>Brake</b><small>Get under the limit before roundabouts</small></span></button>
    <button class="key" id="k-jump" data-k="Jump"><span class="cap" style="font-size:10px">SPC</span><span><b>Bunny hop</b><small>Jump over opening car doors</small></span></button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const C = { night:'#1b2230', slate:'#2a3446', amber:'#f2a541', rust:'#c8553d', chalk:'#eef0ea', muted:'#9aa3b2', green:'#6fbf73' };

  // ---- Levels -------------------------------------------------------------
  // 10 world units = 1 metre. Segments: [length, grade, climb name (optional)]
  const LEVELS = [
    { id: 'orr', name: 'Ocean Road Rollers', blurb: 'Coastal rollers · 4 roundabouts',
      segs: [
        [600,0],[700,.12],[200,0],[600,-.15],[500,0],
        [500,.08],[400,.18],[900,-.12],[500,0],
        [300,.1],[300,-.1],[300,.1],[450,-.14],[500,0],
        [600,.1],[300,0],[400,-.09],[500,0],[600,0]
      ],
      roundabouts: [ { x: 2350, limit: 20 }, { x: 4650, limit: 18 }, { x: 6500, limit: 20 }, { x: 8300, limit: 22 } ],
      finishOffset: 300 },
    { id: 'pwmnr', name: 'PWMNR', blurb: 'Five named climbs · traffic lights · car doors · Sagamore summit',
      segs: [
        [500,0],
        [350,.14,'Mt. Newington'],
        [400,-.08],[300,0],
        [900,.07,'Post Road'],
        [400,-.06],[200,0],
        [250,.06,'The Road'],[250,-.06,'The Road'],[250,.07,'The Road'],
        [250,-.07,'The Road'],[250,.06,'The Road'],[250,-.05,'The Road'],
        [1500,0],
        [300,.22,'Wallis Sands Sprint'],
        [300,-.08],[400,0],
        [1600,.06,'Sagamore'],
        [300,0]
      ],
      roundabouts: [],
      // stop lines: after Mt. Newington, and at the foot of the Post Road descent
      lights: [ { x: 1460, offset: 0 }, { x: 2960, offset: 0.7 } ],
      // parked cars on the long flat before Wallis Sands; doors open at random
      cars: [4800, 5060, 5300, 5560, 5800],
      finishOffset: 300 },  // finish line sits at the top of Sagamore
  ];

  const STEP = 4;
  // traffic light cycle (seconds), driven by ride time so every run sees the same timing
  const LIGHT_G = 0.5, LIGHT_Y = 0.5, LIGHT_R = 0.5, LIGHT_CYCLE = LIGHT_G + LIGHT_Y + LIGHT_R;
  let LIGHTS = [], CARS = [];
  const DOOR_REACH = 700;   // doors only start opening once you are within 70 m
  let LV, sm, H, COURSE, FINISH, ROUNDABOUTS, CLIMBS, HMIN, HMAX, levelIdx = 0;
  function loadLevel(idx) {
    levelIdx = idx; LV = LEVELS[idx];
    const bounds = []; let acc = 0; CLIMBS = [];
    for (const [len, g, name] of LV.segs) {
      if (name) {
        const last = CLIMBS[CLIMBS.length - 1];
        if (last && last.name === name && last.x1 === acc) { last.x1 += len; last.maxG = Math.max(last.maxG, g); last.minG = Math.min(last.minG, g); }
        else CLIMBS.push({ name, x0: acc, x1: acc + len, maxG: g, minG: g, entered: false, crested: false });
      }
      bounds.push([acc, acc + len, g]); acc += len;
    }
    const grades = [];
    const n = Math.ceil(acc / STEP);
    for (let k = 0, j = 0; k < n; k++) {
      const x = k * STEP + STEP / 2;
      while (j < bounds.length - 1 && x >= bounds[j][1]) j++;
      grades.push(bounds[j][2]);
    }
    // smooth grade transitions
    sm = grades.map((_, i) => { let s = 0, c = 0; for (let d = -15; d <= 15; d++) { const k = i + d; if (k >= 0 && k < grades.length) { s += grades[k]; c++; } } return s / c; });
    H = [0];
    for (let i = 0; i < sm.length; i++) H.push(H[i] + sm[i] * STEP);
    COURSE = acc;
    FINISH = COURSE - LV.finishOffset;
    ROUNDABOUTS = LV.roundabouts.map(r => ({ ...r, w: 140, done: false }));
    LIGHTS = (LV.lights || []).map(l => ({ ...l, done: false }));
    CARS = (LV.cars || []).map(x => ({ x, doorX: x + 10 }));
    HMIN = Math.min(...H); HMAX = Math.max(...H);
  }
  loadLevel(0);
  const heightAt = x => { x = Math.max(0, Math.min(COURSE-1, x)); const i = Math.floor(x/STEP), t = x/STEP - i; return H[i]*(1-t) + H[i+1]*t; };
  const gradeAt = x => sm[Math.max(0, Math.min(sm.length-1, Math.floor(x/STEP)))] || 0;

  const KMH = 0.12; // world units/s -> km/h

  // ---- Sound: 8-bit theme + effects (Web Audio, starts on first key/tap) ---
  const SND = (() => {
    let ac = null, master, music, noiseBuf, nextT = 0, step = 0, on = true;
    try { on = localStorage.getItem('rr-music') !== 'off'; } catch (e) {}
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    // 8 bars of eighth notes. 0 = rest.
    const MEL = [
      72,76,79,76, 84,79,76,79,   81,79,76,72, 74,76,74,0,
      77,81,84,81, 77,81,84,86,   83,79,74,79, 83,86,83,0,
      81,84,88,84, 81,84,88,86,   84,81,77,81, 84,86,84,81,
      79,83,86,83, 79,77,76,74,   72,76,79,84, 79,76,72,0
    ];
    const ROOTS = [48,48,53,55,57,53,55,48];
    function ensure() {
      if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { ac = new AC(); } catch (e) { return; }
      master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
      music = ac.createGain(); music.gain.value = on ? 0.32 : 0; music.connect(master);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      nextT = ac.currentTime + 0.05;
      setInterval(schedule, 25);
    }
    function tone(type, f0, t, dur, vol, dest, f1) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t);
      if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.006);
      g.gain.setValueAtTime(vol, t + dur * 0.7);
      g.gain.linearRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.03);
    }
    function noise(t, dur, vol, dest, hp) {
      const s = ac.createBufferSource(); s.buffer = noiseBuf;
      const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
      const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t + dur + 0.03);
    }
    function schedule() {
      while (nextT < ac.currentTime + 0.12) {
        const bonk = S && S.bonkT > 0;
        const sd = bonk ? 0.32 : 0.19;             // the band drags when you bonk
        const shift = bonk ? -5 : 0;
        const i = step % 64, m = MEL[i], root = ROOTS[i >> 3];
        if (m) tone('square', mtof(m + shift), nextT, sd * 0.85, 0.11, music);
        tone('triangle', mtof((i % 2 ? root + 12 : root) + shift), nextT, sd * 0.8, 0.28, music);
        if (i % 4 === 0) tone('triangle', 160, nextT, 0.09, 0.4, music, 40);
        if (i % 2) noise(nextT, 0.035, 0.06, music, 7000);
        if (i % 8 === 4) noise(nextT, 0.08, 0.12, music, 1800);
        nextT += sd; step++;
      }
    }
    const fx = fn => { if (ac) fn(ac.currentTime + 0.01); };
    return {
      ensure,
      get on() { return on; },
      toggle() {
        on = !on;
        try { localStorage.setItem('rr-music', on ? 'on' : 'off'); } catch (e) {}
        if (ac) music.gain.setTargetAtTime(on ? 0.32 : 0, ac.currentTime, 0.05);
      },
      bonk: () => fx(t => { tone('square', 440, t, 0.35, 0.16, master, 200); tone('square', 330, t + 0.38, 0.6, 0.16, master, 90); }),
      crash: () => fx(t => { noise(t, 0.45, 0.35, master, 150); tone('square', 140, t, 0.3, 0.14, master, 40); }),
      boost: () => fx(t => [76, 81, 88, 93].forEach((n, k) => tone('square', mtof(n), t + k * 0.05, 0.07, 0.1, master))),
      hop: () => fx(t => tone('square', 300, t, 0.12, 0.09, master, 700)),
      blip: () => fx(t => tone('square', 990, t, 0.045, 0.07, master)),
      clean: () => fx(t => [84, 88, 91].forEach((n, k) => tone('square', mtof(n), t + k * 0.07, 0.09, 0.1, master))),
      finish: () => fx(t => [72, 76, 79, 84, 79, 84].forEach((n, k) => tone('square', mtof(n), t + k * 0.11, k === 5 ? 0.5 : 0.1, 0.12, master))),
    };
  })();
  const musicBtn = document.getElementById('music');
  const syncMusicBtn = () => { musicBtn.setAttribute('aria-pressed', String(SND.on)); musicBtn.textContent = SND.on ? '♪ Music on (M)' : '♪ Music off (M)'; };
  syncMusicBtn();
  document.getElementById('menuBtn').addEventListener('click', () => { SND.ensure(); goMenu(S.mode === 'menu' ? 0 : 1); cv.focus({ preventScroll: true }); });
  musicBtn.addEventListener('click', () => { SND.ensure(); SND.toggle(); syncMusicBtn(); cv.focus({ preventScroll: true }); });

  // ---- Input --------------------------------------------------------------
  const keys = { ArrowUp:false, ArrowDown:false, ArrowLeft:false, ArrowRight:false };
  const btns = {};
  document.querySelectorAll('.key').forEach(b => {
    btns[b.dataset.k] = b;
    const set = v => e => {
      e.preventDefault(); SND.ensure();
      if (b.dataset.k === 'Jump') { if (v && e.type === 'pointerdown') jump(); b.classList.toggle('on', v && e.type === 'pointerdown'); return; }
      if (S.mode === 'menu') { keys[b.dataset.k] = false; if (v && e.type === 'pointerdown') menuKey(b.dataset.k); return; }
      keys[b.dataset.k] = v; if (v) onStart();
    };
    b.addEventListener('pointerdown', set(true));
    b.addEventListener('pointerup', set(false));
    b.addEventListener('pointerleave', set(false));
    b.addEventListener('pointercancel', set(false));
  });
  addEventListener('keydown', e => {
    SND.ensure();
    if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); if (S.mode !== 'menu' && !e.repeat) jump(); return; }
    if (S.mode === 'menu') { if (menuKey(e.key, e.repeat)) e.preventDefault(); return; }
    if (e.key in keys) { keys[e.key] = true; e.preventDefault(); onStart(); }
    if ((e.key === 'm' || e.key === 'M') && !e.repeat) { SND.toggle(); syncMusicBtn(); }
    if ((e.key === 'Enter' || e.key === 'r' || e.key === 'R') && (S.mode === 'finished')) { reset(); snapCam(); }
    if (e.key === 'Escape') { e.preventDefault(); goMenu(1); }
  });
  addEventListener('keyup', e => { if (e.key in keys) { keys[e.key] = false; e.preventDefault(); } });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  cv.addEventListener('pointerdown', e => {
    cv.focus({ preventScroll: true }); SND.ensure();
    if (S.mode === 'menu') menuPointerDown(e);
    else if (S.mode === 'finished') { reset(); snapCam(); }
  });

  // ---- State --------------------------------------------------------------
  const bestKey = id => 'rr-best-' + id;
  function getBest(id) {
    try {
      const b = localStorage.getItem(bestKey(id)) || (id === 'orr' ? localStorage.getItem('rr-best') : null);
      return b ? +b : null;
    } catch (e) { return null; }
  }
  let S;
  function reset() {
    S = { mode:'ready', x: 120, v: 0, energy: 100, time: 0, penalty: 0, crashes: 0, crashT: 0, bonkT: 0, bonks: 0, crankA: 0, wheelA: 0, msg:'', msgT:0, pose:'sit', best: getBest(LV.id) };
    ROUNDABOUTS.forEach(r => { r.done = false; });
    CLIMBS.forEach(c => { c.entered = c.crested = false; });
    LIGHTS.forEach(l => { l.done = false; });
    CARS.forEach(c => { c.open = false; c.f = 0; c.done = false; c.t = 0.3 + Math.random() * 1.5; });
    S.jy = 0; S.jv = 0; S.carIntro = false;
  }
  function jump() {
    if (S.mode === 'ready') onStart();
    if (S.mode !== 'riding' || S.crashT > 0 || S.jy > 0) return;
    S.jv = 330; S.jy = 0.01; SND.hop();
  }
  const lightClock = () => S.mode === 'menu' ? performance.now() / 1000 : S.time;
  function lightState(L) {
    const p = ((lightClock() + L.offset) % LIGHT_CYCLE + LIGHT_CYCLE) % LIGHT_CYCLE;
    if (p < LIGHT_G) return { c: 'green', left: LIGHT_G - p };
    if (p < LIGHT_G + LIGHT_Y) return { c: 'yellow', left: LIGHT_G + LIGHT_Y - p };
    return { c: 'red', left: LIGHT_CYCLE - p };
  }
  const LAMP = { green: '#38b000', yellow: '#ffc300', red: '#e5383b' };
  function onStart() { if (S.mode === 'ready') S.mode = 'riding'; }

  // ---- Main menu: 3-letter name, then level select -------------------------
  const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const M = { step: 0, slot: 0, name: ['A','A','A'], sel: 0, bests: LEVELS.map(l => getBest(l.id)) };
  try {
    const n = localStorage.getItem('rr-name');
    if (n && /^[A-Z]{3}$/.test(n)) { M.name = n.split(''); M.step = 1; }
    const l = +localStorage.getItem('rr-level');
    if (l >= 0 && l < LEVELS.length) M.sel = l;
  } catch (e) {}
  const playerName = () => M.name.join('');
  function saveMenu() { try { localStorage.setItem('rr-name', playerName()); localStorage.setItem('rr-level', String(M.sel)); } catch (e) {} }
  function previewLevel() { loadLevel(M.sel); reset(); S.mode = 'menu'; snapCam(); }
  function goMenu(step) { M.step = step; for (const k in keys) keys[k] = false; previewLevel(); }
  function startLevel() { saveMenu(); loadLevel(M.sel); reset(); snapCam(); SND.blip(); }
  function menuKey(k, repeat) {
    if (M.step === 0) {
      if (k === 'ArrowUp' || k === 'ArrowDown') {
        const d = k === 'ArrowUp' ? 1 : -1, c = ABC.indexOf(M.name[M.slot]);
        M.name[M.slot] = ABC[(c + d + 26) % 26]; SND.blip(); return true;
      }
      if (k === 'ArrowLeft' || k === 'Backspace') { M.slot = Math.max(0, M.slot - 1); SND.blip(); return true; }
      if (k === 'ArrowRight') { if (M.slot < 2) M.slot++; else { M.step = 1; saveMenu(); } SND.blip(); return true; }
      if (/^[a-z]$/i.test(k) && !repeat) { M.name[M.slot] = k.toUpperCase(); if (M.slot < 2) M.slot++; SND.blip(); return true; }
      if (k === 'Enter') { M.step = 1; saveMenu(); SND.blip(); return true; }
      return false;
    }
    if (k === 'ArrowUp' || k === 'ArrowDown') {
      M.sel = (M.sel + (k === 'ArrowDown' ? 1 : -1) + LEVELS.length) % LEVELS.length;
      previewLevel(); SND.blip(); return true;
    }
    if (k === 'Enter' || k === 'ArrowRight') { startLevel(); return true; }
    if (k === 'Escape' || k === 'Backspace' || k === 'ArrowLeft') { M.step = 0; M.slot = 0; SND.blip(); return true; }
    if ((k === 'm' || k === 'M') && !repeat) { SND.toggle(); syncMusicBtn(); return true; }
    return false;
  }
  loadLevel(M.sel);
  reset();
  S.mode = 'menu';
  function flash(m, t=1.6) { S.msg = m; S.msgT = t; }

  // ---- Physics ------------------------------------------------------------
  const G = 500, ROLL = 14, DRAG = 0.00066, DRAG_TUCK = 0.00035;
  const BONK_KMH = 15, BONK_TIME = 2;
  function update(dt) {
    if (S.msgT > 0) S.msgT -= dt;
    if (S.mode === 'menu') {   // attract mode: rider cruises the selected course behind the menu
      S.v = 160; S.x += S.v * dt; S.wheelA += S.v * dt / 14; S.crankA += 5 * dt; S.pose = 'sit';
      if (S.x > FINISH) { S.x = 120; snapCam(); }
      return;
    }
    if (S.mode !== 'riding') return;
    S.time += dt;

    if (S.crashT > 0) { S.crashT -= dt; S.v = 0; return; }

    const up = keys.ArrowUp, down = keys.ArrowDown, right = keys.ArrowRight, left = keys.ArrowLeft;
    if (S.bonkT > 0) {
      S.bonkT = Math.max(0, S.bonkT - dt);
      if (S.bonkT === 0) flash('Legs are back. Go!', 1.2);
    }
    const bonked = S.bonkT > 0;
    const standing = up && S.energy > 0 && !bonked;   // no standing while bonked
    const tucking = down && !up;
    const pedaling = right || up;

    let a = 0;
    if (standing) a += 230;
    else if (pedaling) a += tucking ? 90 : 120;

    const g = gradeAt(S.x);
    a -= G * g / Math.sqrt(1 + g*g);
    const sgn = Math.sign(S.v) || 1;
    a -= (tucking ? DRAG_TUCK : DRAG) * S.v * S.v * sgn;
    if (Math.abs(S.v) > 1) a -= ROLL * sgn;
    if (left) a -= 320 * sgn;

    S.v += a * dt;
    // bonk: forced down to 15 km/h for the duration
    if (bonked) { const cap = BONK_KMH / KMH; if (S.v > cap) S.v = Math.max(cap, S.v - 700 * dt); }
    if (left && Math.abs(S.v) < 6) S.v = 0;
    if (!pedaling && Math.abs(S.v) < 3 && g >= 0) S.v = Math.min(S.v, 0) * 0.9; // stalled on a hill
    S.v = Math.max(S.v, -60);
    const prevX = S.x;
    S.x = Math.max(60, S.x + S.v * dt);
    // bunny hop
    if (S.jy > 0) { S.jv -= 1100 * dt; S.jy += S.jv * dt; if (S.jy <= 0) { S.jy = 0; S.jv = 0; } }

    // parked cars: doors swing open at random while you approach
    if (CARS.length && !S.carIntro && S.x >= CARS[0].x - 450) { S.carIntro = true; flash('Parked cars ahead · SPACE to hop open doors', 2.4); }
    for (const c of CARS) {
      const d = c.doorX - S.x;
      if (d > -40 && d < DOOR_REACH) {
        c.t -= dt;
        if (c.t <= 0) { c.open = !c.open; c.t = c.open ? 0.7 + Math.random() * 1.1 : 0.4 + Math.random() * 1.6; }
      } else if (d <= -40) c.open = false;
      c.f += ((c.open ? 1 : 0) - c.f) * Math.min(1, dt * 12);
      if (!c.done && prevX < c.doorX && S.x >= c.doorX) {
        c.done = true;
        if (c.f > 0.45) {
          if (S.jy < 16) {
            S.crashes++; S.penalty += 5; S.crashT = 1.6; S.v = 0; S.jy = 0; S.jv = 0; S.x = c.doorX + 6;
            flash('Doored! Crash · +5s', 2.2); SND.crash();
            return;
          }
          flash('Bunny hop! Cleared the door', 1.2); SND.clean();
        }
      }
    }

    // energy
    if (standing) S.energy -= 24 * dt;
    else if (pedaling) S.energy += 4 * dt;
    else S.energy += 11 * dt;
    if (bonked) S.energy += 11 * dt;
    if (standing && S.energy <= 0) {
      S.bonkT = BONK_TIME; S.bonks++;
      flash('BONK! Out of energy', BONK_TIME);
      SND.bonk();
    }
    S.energy = Math.max(0, Math.min(100, S.energy));

    S.pose = left ? 'brake' : S.bonkT > 0 ? 'bonk' : standing ? 'stand' : tucking ? 'tuck' : 'sit';
    S.crankA += (pedaling ? Math.max(4, S.v * 0.04) : 0) * dt * (standing ? 1.4 : 1);
    S.wheelA += S.v * dt / 14;

    // roundabouts
    for (const r of ROUNDABOUTS) {
      if (r.done) continue;
      if (S.x >= r.x - r.w/2) {
        const kmh = S.v * KMH;
        if (kmh > r.limit) {
          S.crashes++; S.penalty += 5; S.crashT = 1.6; S.v = 0;
          S.x = r.x - r.w/2 + 2;
          flash(`Too hot! ${kmh.toFixed(0)} km/h into a ${r.limit} zone · +5s`, 2.2);
          SND.crash();
        } else {
          flash('Clean line through the roundabout', 1.2);
          SND.clean();
        }
        r.done = true;
      }
    }
    // traffic lights: judged at the moment the rider crosses the stop line
    for (const L of LIGHTS) {
      if (L.done || S.x < L.x) continue;
      L.done = true;
      const st = lightState(L).c;
      if (st === 'red') {
        S.crashes++; S.penalty += 5; S.crashT = 1.6; S.v = 0; S.x = L.x + 4;
        flash('Ran the red! Crash · +5s', 2.2);
        SND.crash();
      } else if (st === 'green') {
        S.v *= 1.10;
        flash('Green light! +10% speed', 1.3);
        SND.boost();
      } else {
        flash('Squeaked through on yellow', 1.2);
      }
    }

    // speed cap while inside a roundabout
    for (const r of ROUNDABOUTS) {
      if (S.x > r.x - r.w/2 && S.x < r.x + r.w/2) S.v = Math.min(S.v, r.limit / KMH);
    }

    // named climbs
    for (const c of CLIMBS) {
      if (!c.entered && S.x >= c.x0) {
        c.entered = true;
        flash(`${c.name} · ${climbStats(c)}`, 2.2);
      }
      if (c.entered && !c.crested && S.x >= c.x1 && c.x1 < FINISH) { c.crested = true; flash(`Crested ${c.name}`, 1.4); SND.clean(); }
    }

    if (S.x >= FINISH) {
      S.mode = 'finished';
      SND.finish();
      const final = S.time + S.penalty;
      S.newBest = false;
      if (!S.best || final < S.best) {
        S.best = final; S.newBest = true; M.bests[levelIdx] = final;
        try { localStorage.setItem(bestKey(LV.id), String(final)); } catch (e) {}
      }
    }
  }

  // ---- Rendering ----------------------------------------------------------
  let W = 0, Ht = 0, dpr = 1, camX = 0, camY = 0;
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = cv.clientWidth;
    Ht = Math.round(Math.max(260, Math.min(520, W * 0.52)));
    cv.style.height = Ht + 'px';
    cv.width = W * dpr; cv.height = Ht * dpr;
  }
  addEventListener('resize', resize); resize();

  function snapCam() { camX = S.x - 200; camY = heightAt(S.x); }
  const climbStats = c => c.minG < 0
    ? `rollers · ${Math.round((c.x1 - c.x0) / 10)} m · up to ${Math.round(c.maxG * 100)}%`
    : `${Math.round((c.x1 - c.x0) / 10)} m · max ${Math.round(c.maxG * 100)}%`;
  const fmt = t => { const m = Math.floor(t/60), s = t - m*60; return `${m}:${s.toFixed(1).padStart(4,'0')}`; };

  function draw() {
    const sc = Ht / 480;
    ctx.setTransform(dpr*sc, 0, 0, dpr*sc, 0, 0);
    const VW = W / sc, VH = 480;

    camX += ((S.x - VW * 0.3) - camX) * 0.2;
    camY += (heightAt(S.x) - camY) * 0.08;
    const base = VH * 0.62;
    const sy = h => base - (h - camY);

    // sky
    const sky = ctx.createLinearGradient(0,0,0,VH);
    sky.addColorStop(0,'#1b2230'); sky.addColorStop(.55,'#3b3a52'); sky.addColorStop(.85,'#a8604a'); sky.addColorStop(1,'#f2a541');
    ctx.fillStyle = sky; ctx.fillRect(0,0,VW,VH);
    // sun
    ctx.fillStyle = 'rgba(242,165,65,.55)';
    ctx.beginPath(); ctx.arc(VW*0.78, VH*0.7, 46, 0, Math.PI*2); ctx.fill();

    // parallax ridges (autumn hills)
    const ridge = (par, amp, off, col, yb) => {
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, VH);
      for (let px=0; px<=VW+20; px+=20) {
        const wx = px + camX*par;
        const y = yb + Math.sin(wx*0.004+off)*amp + Math.sin(wx*0.011+off*2)*amp*0.4;
        ctx.lineTo(px, y);
      }
      ctx.lineTo(VW, VH); ctx.fill();
    };
    ridge(0.15, 30, 1, '#4a3f55', VH*0.55);
    ridge(0.3, 24, 3, '#6b3f3a', VH*0.62);
    // tree stipple on near ridge
    for (let i=0;i<40;i++){
      const wx = Math.floor((camX*0.45)/60)*60 + i*60;
      const px = wx - camX*0.45;
      const y = VH*0.68 + Math.sin(wx*0.007)*18;
      ctx.fillStyle = ['#c8553d','#d9822b','#8a3b2e','#e0a43a'][Math.abs(Math.floor(wx/60))%4];
      ctx.beginPath(); ctx.moveTo(px, y-20); ctx.lineTo(px-8, y+4); ctx.lineTo(px+8, y+4); ctx.fill();
    }

    // climb titles: huge background text that slides in, holds mid-screen, then slides out
    for (const c of CLIMBS) {
      const aS = c.x0 - camX + 420, aE = c.x1 - camX - 60;
      const tx = Math.min(Math.max(aS, VW / 2), aE);
      if (tx < -500 || tx > VW + 500) continue;
      const title = c.name.toUpperCase();
      let fs = 92;
      ctx.font = `800 italic ${fs}px "Barlow Condensed", sans-serif`;
      const w = ctx.measureText(title).width;
      if (w > VW * 0.9) { fs = Math.floor(fs * VW * 0.9 / w); ctx.font = `800 italic ${fs}px "Barlow Condensed", sans-serif`; }
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(238,240,234,.17)'; ctx.fillText(title, tx, 222);
      ctx.strokeStyle = 'rgba(242,165,65,.45)'; ctx.lineWidth = 1.5; ctx.strokeText(title, tx, 222);
      ctx.font = `10px ${PIX}`; ctx.fillStyle = 'rgba(238,240,234,.55)';
      ctx.fillText(climbStats(c).toUpperCase(), tx, 246);
      if (c === CLIMBS[CLIMBS.length - 1] && c.x1 >= FINISH) { ctx.fillStyle = 'rgba(242,165,65,.75)'; ctx.fillText('MOUNTAIN-TOP FINISH', tx, 264); }
    }

    // big roadside speed boards at each roundabout (background layer)
    const kmhNow = Math.max(0, S.v * KMH);
    for (const r of ROUNDABOUTS) {
      const px = r.x - camX;
      if (px < -220 || px > VW + 220) continue;
      drawSpeedBoard(px, sy(heightAt(r.x)), r.limit, kmhNow);
    }

    // big background signal boards at each traffic light
    for (const L of LIGHTS) {
      const px = L.x - camX;
      if (px < -220 || px > VW + 220) continue;
      drawSignalBoard(px, sy(heightAt(L.x)), lightState(L));
    }

    // terrain
    ctx.fillStyle = '#2b2f2a';
    ctx.beginPath(); ctx.moveTo(0, VH);
    for (let px=-10; px<=VW+10; px+=6) ctx.lineTo(px, sy(heightAt(camX+px)));
    ctx.lineTo(VW+10, VH); ctx.fill();
    // verge
    ctx.strokeStyle = '#4c6b3c'; ctx.lineWidth = 10;
    ctx.beginPath();
    for (let px=-10; px<=VW+10; px+=6) { const y = sy(heightAt(camX+px)) + 5; px<0?ctx.moveTo(px,y):ctx.lineTo(px,y); }
    ctx.stroke();
    // road surface
    ctx.strokeStyle = '#3a3d44'; ctx.lineWidth = 7;
    ctx.beginPath();
    for (let px=-10; px<=VW+10; px+=6) { const y = sy(heightAt(camX+px)); px<0?ctx.moveTo(px,y):ctx.lineTo(px,y); }
    ctx.stroke();
    // centre dashes
    ctx.strokeStyle = 'rgba(238,240,234,.55)'; ctx.lineWidth = 1.5; ctx.setLineDash([12,14]); ctx.lineDashOffset = camX;
    ctx.beginPath();
    for (let px=-10; px<=VW+10; px+=6) { const y = sy(heightAt(camX+px)) - 1; px<0?ctx.moveTo(px,y):ctx.lineTo(px,y); }
    ctx.stroke(); ctx.setLineDash([]);

    // km markers
    ctx.font = '600 11px "IBM Plex Mono", monospace'; ctx.textAlign = 'center';
    for (let m = Math.ceil(camX/1000)*1000; m < camX+VW; m += 1000) {
      const px = m - camX, y = sy(heightAt(m));
      ctx.fillStyle = C.chalk; ctx.fillRect(px-1, y-26, 2, 26);
      ctx.fillStyle = '#eef0ea'; ctx.fillRect(px-12, y-40, 24, 14);
      ctx.fillStyle = C.night; ctx.fillText(`${m/10}`, px, y-29);
    }

    // roundabouts + warning signs
    for (const r of ROUNDABOUTS) {
      const px = r.x - camX;
      if (px < -300 || px > VW + 500) continue;
      // warning sign 450 units before
      const wx = r.x - 450 - camX, wy = sy(heightAt(r.x - 450));
      ctx.fillStyle = '#777'; ctx.fillRect(wx-1.5, wy-60, 3, 60);
      ctx.fillStyle = C.chalk; ctx.beginPath(); ctx.arc(wx, wy-66, 15, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = C.rust; ctx.lineWidth = 4; ctx.stroke();
      ctx.fillStyle = C.night; ctx.font = '800 italic 16px "Barlow Condensed", sans-serif';
      ctx.fillText(String(r.limit), wx, wy-60);
      // roundabout circulation sign
      const sx2 = r.x - r.w/2 - 30 - camX, sy2 = sy(heightAt(r.x - r.w/2 - 30));
      ctx.fillStyle = '#777'; ctx.fillRect(sx2-1.5, sy2-50, 3, 50);
      ctx.fillStyle = '#2f6db5'; ctx.beginPath(); ctx.arc(sx2, sy2-56, 12, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = C.chalk; ctx.lineWidth = 2;
      for (let i=0;i<3;i++){ const a0 = i*2.094; ctx.beginPath(); ctx.arc(sx2, sy2-56, 6, a0, a0+1.4); ctx.stroke(); }
      // island
      const iy = sy(heightAt(r.x));
      ctx.fillStyle = '#5a5e66'; ctx.beginPath(); ctx.ellipse(px, iy+2, r.w/2, 10, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#4c6b3c'; ctx.beginPath(); ctx.ellipse(px, iy-3, r.w/2-14, 9, 0, Math.PI, 0); ctx.fill();
      // chevron board
      ctx.fillStyle = C.chalk; ctx.fillRect(px-22, iy-34, 44, 16);
      ctx.fillStyle = C.rust;
      for (let i=0;i<3;i++){ const cx = px-14+i*14; ctx.beginPath(); ctx.moveTo(cx-4,iy-32); ctx.lineTo(cx+4,iy-26); ctx.lineTo(cx-4,iy-20); ctx.lineTo(cx-1,iy-26); ctx.fill(); }
      ctx.fillStyle = '#777'; ctx.fillRect(px-1.5, iy-18, 3, 14);
      // zone shading
      ctx.fillStyle = r.done ? 'rgba(111,191,115,.10)' : 'rgba(200,85,61,.12)';
      ctx.fillRect(px - r.w/2, iy - 120, r.w, 120);
    }

    // traffic light poles + stop lines
    for (const L of LIGHTS) {
      const px = L.x - camX;
      if (px < -60 || px > VW + 60) continue;
      const y = sy(heightAt(L.x)), st = lightState(L).c;
      ctx.fillStyle = C.chalk; ctx.fillRect(px - 2, y - 4, 4, 6);            // stop line
      ctx.fillStyle = '#4a4f58'; ctx.fillRect(px + 8, y - 80, 4, 80);        // pole
      ctx.fillStyle = '#151a24'; ctx.fillRect(px + 2, y - 118, 16, 42);      // housing
      ['red', 'yellow', 'green'].forEach((c, k) => {
        const on = st === c;
        ctx.fillStyle = on ? LAMP[c] : 'rgba(238,240,234,.12)';
        if (on) { ctx.shadowColor = LAMP[c]; ctx.shadowBlur = 14; }
        ctx.beginPath(); ctx.arc(px + 10, y - 110 + k * 13, 5, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      });
    }

    // finish line
    {
      const px = FINISH - camX, y = sy(heightAt(FINISH));
      if (px > -60 && px < VW + 60) {
        ctx.fillStyle = '#777'; ctx.fillRect(px-50, y-90, 4, 90); ctx.fillRect(px+46, y-90, 4, 90);
        for (let i=0;i<12;i++) for (let j=0;j<2;j++) { ctx.fillStyle = (i+j)%2 ? C.night : C.chalk; ctx.fillRect(px-50+i*8.33, y-104+j*8, 8.4, 8); }
        ctx.fillStyle = C.amber; ctx.font = '800 italic 18px "Barlow Condensed", sans-serif';
        ctx.fillText('FINISH', px, y-110);
        for (let j=0;j<4;j++) { ctx.fillStyle = j%2?C.night:C.chalk; ctx.fillRect(px-3, y-4+0*j, 6, 4); }
      }
    }

    // parked cars (behind the bike lane)
    const CAR_COLS = ['#5f7fa3', '#a34a3d', '#d9d2c3', '#3f6b4f', '#7a6a8f'];
    const carVis = CARS.map((c, i) => ({ c, px: c.x - camX, gy: sy(heightAt(c.x)) - 4, col: CAR_COLS[i % CAR_COLS.length] }))
      .filter(o => o.px > -80 && o.px < VW + 80);
    for (const { c, px, gy, col } of carVis) {
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(px - 36, gy - 3, 78, 3);
      ctx.fillStyle = col; ctx.fillRect(px - 34, gy - 20, 74, 13);
      ctx.fillRect(px - 22, gy - 32, 44, 12);
      ctx.fillStyle = 'rgba(190,220,240,.55)'; ctx.fillRect(px - 19, gy - 30, 17, 8); ctx.fillRect(px + 1, gy - 30, 17, 8);
      ctx.fillStyle = '#151a24';
      for (const wx of [px - 20, px + 26]) { ctx.beginPath(); ctx.arc(wx, gy - 6, 6, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = '#ffd27a'; ctx.fillRect(px + 37, gy - 18, 3, 3);   // headlight
      ctx.fillStyle = '#e5383b'; ctx.fillRect(px - 34, gy - 18, 2, 3);   // tail light
      ctx.strokeStyle = 'rgba(21,26,36,.6)'; ctx.lineWidth = 1; ctx.strokeRect(px - 10, gy - 31, 20, 23);
      if (c.f > 0.05) { ctx.fillStyle = 'rgba(21,26,36,.85)'; ctx.fillRect(px - 10, gy - 31, 20 * c.f, 23); }  // doorway
    }

    if (S.jy > 0) {   // shadow under a hopping rider
      const gx = S.x - camX, gyR = sy(heightAt(S.x));
      ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(gx, gyR, 16 - Math.min(8, S.jy / 6), 3, 0, 0, Math.PI * 2); ctx.fill();
    }
    drawRider(S.x - camX, sy(heightAt(S.x)) - S.jy);

    // open doors swing out into the bike lane, drawn in front of the rider
    for (const { c, px, gy, col } of carVis) {
      if (c.f < 0.05) continue;
      const hx = px + 10, w = 20 * (1 - 0.5 * c.f), dy = 10 * c.f;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(hx, gy - 31); ctx.lineTo(hx - w, gy - 31 + dy); ctx.lineTo(hx - w, gy - 6 + dy); ctx.lineTo(hx, gy - 8); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = C.amber; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = 'rgba(190,220,240,.55)';
      ctx.beginPath(); ctx.moveTo(hx - 1, gy - 29); ctx.lineTo(hx - w + 2, gy - 29 + dy); ctx.lineTo(hx - w + 2, gy - 22 + dy); ctx.lineTo(hx - 1, gy - 22); ctx.closePath(); ctx.fill();
      if (c.f > 0.45 && (performance.now() / 150 | 0) % 2) {
        ctx.fillStyle = C.amber; ctx.textAlign = 'center'; ctx.font = `12px ${PIX}`;
        ctx.fillText('!', px, gy - 42);
      }
    }

    drawHUD(VW, VH);
  }

  const PIX = '"Press Start 2P", "IBM Plex Mono", monospace';
  function drawSpeedBoard(cx, groundY, limit, kmh) {
    const over = kmh > limit;
    const stat = over ? '#e5383b' : '#38b000';
    const bw = 280, bh = 104, top = groundY - 230, left = cx - bw / 2;
    // legs
    ctx.fillStyle = '#4a4f58';
    ctx.fillRect(left + 30, top + bh, 6, groundY - top - bh);
    ctx.fillRect(left + bw - 36, top + bh, 6, groundY - top - bh);
    // board
    ctx.fillStyle = '#151a24'; ctx.fillRect(left, top, bw, bh);
    ctx.strokeStyle = stat; ctx.lineWidth = 4; ctx.strokeRect(left + 2, top + 2, bw - 4, bh - 4);
    // limit roundel
    const rx = left + 58, ry = top + bh / 2;
    ctx.fillStyle = '#f5f5f0'; ctx.beginPath(); ctx.arc(rx, ry, 40, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = stat; ctx.lineWidth = 9; ctx.beginPath(); ctx.arc(rx, ry, 35, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#151a24'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `20px ${PIX}`; ctx.fillText(String(limit), rx + 1, ry + 2);
    // your speed LED
    const lx = left + 178;
    ctx.fillStyle = '#9aa3b2'; ctx.font = `8px ${PIX}`;
    ctx.fillText('YOUR SPEED', lx, top + 20);
    ctx.fillStyle = stat; ctx.font = `34px ${PIX}`;
    ctx.shadowColor = stat; ctx.shadowBlur = 12;
    ctx.fillText(String(Math.round(kmh)).padStart(2, '0'), lx, ry + 6);
    ctx.shadowBlur = 0;
    ctx.fillStyle = stat; ctx.font = `8px ${PIX}`;
    ctx.fillText(over ? 'SLOW DOWN' : 'THANK YOU', lx, top + bh - 14);
    ctx.textBaseline = 'alphabetic';
  }

  function drawSignalBoard(cx, groundY, st) {
    const bw = 280, bh = 104, top = groundY - 230, left = cx - bw / 2;
    const col = LAMP[st.c];
    ctx.fillStyle = '#4a4f58';
    ctx.fillRect(left + 30, top + bh, 6, groundY - top - bh);
    ctx.fillRect(left + bw - 36, top + bh, 6, groundY - top - bh);
    ctx.fillStyle = '#151a24'; ctx.fillRect(left, top, bw, bh);
    ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.strokeRect(left + 2, top + 2, bw - 4, bh - 4);
    // three big lamps
    ['red', 'yellow', 'green'].forEach((c, k) => {
      const lx = left + 36 + k * 50, ly = top + bh / 2, on = st.c === c;
      ctx.fillStyle = on ? LAMP[c] : 'rgba(238,240,234,.08)';
      if (on) { ctx.shadowColor = LAMP[c]; ctx.shadowBlur = 22; }
      ctx.beginPath(); ctx.arc(lx, ly, 20, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    });
    // countdown + instruction
    const tx = left + 228;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#9aa3b2'; ctx.font = `8px ${PIX}`; ctx.fillText('SIGNAL', tx, top + 20);
    ctx.fillStyle = col; ctx.font = `26px ${PIX}`;
    ctx.fillText(st.left.toFixed(1), tx, top + bh / 2 + 4);
    ctx.font = `8px ${PIX}`;
    ctx.fillText(st.c === 'green' ? 'GO +10%' : st.c === 'yellow' ? 'SLOW' : 'STOP', tx, top + bh - 16);
    ctx.textBaseline = 'alphabetic';
  }

  function drawRider(px, py) {
    const g = gradeAt(S.x);
    ctx.save();
    ctx.translate(px, py - 2);
    ctx.rotate(-Math.atan(g));
    if (S.crashT > 0) { ctx.rotate((1.6 - S.crashT) * 4); }
    const wr = 9;
    // wheels
    for (const wx of [-12, 12]) {
      ctx.strokeStyle = C.chalk; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(wx, -wr, wr, 0, Math.PI*2); ctx.stroke();
      ctx.lineWidth = 1;
      for (let k=0;k<3;k++){ const a = S.wheelA + k*Math.PI/3; ctx.beginPath(); ctx.moveTo(wx+Math.cos(a)*wr, -wr+Math.sin(a)*wr); ctx.lineTo(wx-Math.cos(a)*wr, -wr-Math.sin(a)*wr); ctx.stroke(); }
    }
    // frame
    ctx.strokeStyle = C.amber; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-12,-wr); ctx.lineTo(0,-wr); ctx.lineTo(9,-wr-10); ctx.lineTo(-3,-wr-10); ctx.closePath(); ctx.moveTo(9,-wr-10); ctx.lineTo(12,-wr); ctx.stroke();
    // crank
    const ca = S.crankA * 6;
    ctx.strokeStyle = C.chalk; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(Math.cos(ca)*5, -wr+Math.sin(ca)*5); ctx.lineTo(-Math.cos(ca)*5, -wr-Math.sin(ca)*5); ctx.stroke();

    // block rider (body changes with pose)
    let bw = 12, bh = 18, bx = -6, by = -wr - 28, hx = 2, hy = -wr - 34;
    if (S.pose === 'stand') { bh = 24; by = -wr - 36; bx = -3; hx = 5; hy = -wr - 42; }
    if (S.pose === 'tuck')  { bw = 20; bh = 9;  bx = -8; by = -wr - 20; hx = 13; hy = -wr - 22; }
    if (S.pose === 'brake') { bx = -9; hx = -1; }
    if (S.pose === 'bonk')  { bh = 15; by = -wr - 24; bx = -5; hx = 9; hy = -wr - 24; }
    ctx.fillStyle = C.rust; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = C.chalk; ctx.fillRect(hx - 4, hy - 4, 8, 8);
    ctx.fillStyle = C.night; ctx.fillRect(hx - 4, hy - 4, 8, 3); // helmet band
    if (S.pose === 'brake') { ctx.fillStyle = '#ff3b30'; ctx.fillRect(-16, -wr - 12, 4, 3); }
    // dizzy pixels circling a bonked rider
    if (S.pose === 'bonk') {
      const t = performance.now() / 180;
      for (let k = 0; k < 3; k++) {
        const a = t + k * 2.09;
        ctx.fillStyle = k % 2 ? C.amber : C.chalk;
        ctx.fillRect(hx + Math.cos(a) * 9 - 1.5, hy - 12 + Math.sin(a) * 3 - 1.5, 3, 3);
      }
    }
    // effort sweat when standing
    if (S.pose === 'stand' && (performance.now()/120|0)%2) { ctx.fillStyle = '#9fd3ff'; ctx.fillRect(-10, by - 4, 2, 3); }
    ctx.restore();
  }

  // menu hit regions (virtual coords), rebuilt every frame by drawMenu
  let HITS = [];
  function drawMenu(VW, VH) {
    HITS = [];
    ctx.fillStyle = 'rgba(27,34,48,.8)'; ctx.fillRect(0, 0, VW, VH);
    ctx.textAlign = 'center';
    ctx.font = `26px ${PIX}`;
    ctx.fillStyle = C.rust; ctx.fillText('ROUNDABOUT RUSH', VW / 2 + 3, 62);
    ctx.fillStyle = C.amber; ctx.fillText('ROUNDABOUT RUSH', VW / 2, 59);

    const blink = (performance.now() / 400 | 0) % 2;
    // player initials: tap the arrows, swipe a box up/down, or use the keyboard
    ctx.font = '600 10px "IBM Plex Mono", monospace'; ctx.fillStyle = C.muted;
    ctx.fillText('PLAYER', VW / 2 - 30, 92);
    const by = 122, bw = 52, bh = 58, gap = 64, bx0 = VW / 2 - 30 - gap - bw / 2;
    for (let i = 0; i < 3; i++) {
      const bx = bx0 + i * gap, active = M.step === 0 && M.slot === i;
      ctx.fillStyle = active ? '#3a4760' : C.slate; ctx.fillRect(bx, by, bw, bh);
      ctx.strokeStyle = active ? C.amber : (M.step === 0 ? C.muted : 'rgba(154,163,178,.4)'); ctx.lineWidth = 2; ctx.strokeRect(bx + 1, by + 1, bw - 2, bh - 2);
      ctx.fillStyle = C.chalk; ctx.font = `26px ${PIX}`; ctx.fillText(M.name[i], bx + bw / 2 + 1, by + 43);
      if (active && blink) { ctx.fillStyle = C.amber; ctx.fillRect(bx + 12, by + 49, bw - 24, 3); }
      // arrows
      const cx = bx + bw / 2;
      ctx.fillStyle = active ? C.amber : 'rgba(238,240,234,.45)';
      ctx.beginPath(); ctx.moveTo(cx, by - 20); ctx.lineTo(cx - 10, by - 6); ctx.lineTo(cx + 10, by - 6); ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx, by + bh + 20); ctx.lineTo(cx - 10, by + bh + 6); ctx.lineTo(cx + 10, by + bh + 6); ctx.fill();
      HITS.push({ x: bx - 6, y: by - 30, w: bw + 12, h: 30, act: 'up', slot: i });
      HITS.push({ x: bx - 6, y: by, w: bw + 12, h: bh, act: 'box', slot: i });
      HITS.push({ x: bx - 6, y: by + bh, w: bw + 12, h: 30, act: 'down', slot: i });
    }
    // OK button
    const okx = bx0 + 3 * gap + 6, oky = by + 6, okw = 72, okh = bh - 12;
    const okOn = M.step === 0;
    ctx.fillStyle = okOn ? C.amber : C.slate; ctx.fillRect(okx, oky, okw, okh);
    ctx.fillStyle = okOn ? C.night : C.muted; ctx.font = `14px ${PIX}`; ctx.fillText('OK', okx + okw / 2, oky + okh / 2 + 7);
    HITS.push({ x: okx - 6, y: oky - 10, w: okw + 12, h: okh + 20, act: 'ok' });

    // level select: each whole row is a big tap target
    ctx.font = '600 10px "IBM Plex Mono", monospace'; ctx.fillStyle = C.muted;
    ctx.fillText('SELECT LEVEL', VW / 2, 228);
    const rw = Math.min(560, VW - 40), rx = VW / 2 - rw / 2, rh = 62;
    LEVELS.forEach((l, i) => {
      const ry = 238 + i * (rh + 8), sel = i === M.sel, live = sel && M.step === 1;
      ctx.fillStyle = sel ? '#3a4760' : C.slate; ctx.fillRect(rx, ry, rw, rh);
      if (sel) { ctx.strokeStyle = live ? C.amber : C.muted; ctx.lineWidth = 2; ctx.strokeRect(rx + 1, ry + 1, rw - 2, rh - 2); }
      if (live && blink) { ctx.fillStyle = C.amber; ctx.beginPath(); ctx.moveTo(rx + 12, ry + rh / 2 - 9); ctx.lineTo(rx + 25, ry + rh / 2); ctx.lineTo(rx + 12, ry + rh / 2 + 9); ctx.fill(); }
      ctx.textAlign = 'left';
      ctx.fillStyle = C.chalk; ctx.font = '800 italic 26px "Barlow Condensed", sans-serif';
      ctx.fillText(l.name.toUpperCase(), rx + 36, ry + 29);
      ctx.fillStyle = C.muted; ctx.font = '400 11px "IBM Plex Mono", monospace';
      ctx.fillText(l.blurb, rx + 36, ry + 48);
      ctx.textAlign = 'right'; ctx.font = '600 12px "IBM Plex Mono", monospace';
      const b = M.bests[i];
      ctx.fillStyle = b ? C.amber : C.muted;
      ctx.fillText(b ? `BEST ${fmt(b)}` : 'NO TIME YET', rx + rw - 14, ry + 26);
      ctx.fillStyle = C.chalk; ctx.font = `9px ${PIX}`;
      ctx.fillText('RIDE ▸', rx + rw - 14, ry + 48);
      ctx.textAlign = 'center';
      HITS.push({ x: rx - 10, y: ry - 4, w: rw + 20, h: rh + 8, act: 'level', idx: i });
    });

    ctx.fillStyle = C.chalk; ctx.font = '400 12px "IBM Plex Mono", monospace';
    ctx.fillText(M.step === 0
      ? 'Swipe a letter or tap ▲▼ · keys: ↑↓ letter, ←→ move, type A–Z · OK/Enter'
      : 'Tap a level to ride · keys: ↑↓ choose, Enter ride, Esc edit name', VW / 2, 396);
    ctx.fillStyle = C.muted; ctx.font = `8px ${PIX}`;
    ctx.fillText('GLOBAL LEADERBOARD · COMING SOON', VW / 2, 420);
  }

  // touch / mouse on the menu
  function toVirtual(e) {
    const r = cv.getBoundingClientRect(), sc = Ht / 480;
    return { x: (e.clientX - r.left) / sc, y: (e.clientY - r.top) / sc };
  }
  const hitAt = p => HITS.find(h => p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h);
  function bumpLetter(slot, d) {
    M.step = 0; M.slot = slot;
    const c = ABC.indexOf(M.name[slot]);
    M.name[slot] = ABC[(c + d + 26) % 26]; SND.blip();
  }
  let drag = null;
  function menuPointerDown(e) {
    const p = toVirtual(e), h = hitAt(p);
    drag = { h, y0: p.y, last: p.y, acc: 0, moved: false };
    if (h && (h.act === 'box' || h.act === 'up' || h.act === 'down')) { try { cv.setPointerCapture(e.pointerId); } catch (err) {} }
  }
  function menuPointerMove(e) {
    if (!drag || !drag.h || !['box', 'up', 'down'].includes(drag.h.act)) return;
    const p = toVirtual(e);
    drag.acc += p.y - drag.last; drag.last = p.y;
    while (Math.abs(drag.acc) >= 22) {          // swipe up = next letter, swipe down = previous
      const d = drag.acc < 0 ? 1 : -1;
      bumpLetter(drag.h.slot, d);
      drag.acc += d * 22; drag.moved = true;
    }
  }
  function menuPointerUp(e) {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.moved) return;
    const h = hitAt(toVirtual(e)) || d.h;
    if (!h) { if (M.step === 0) { M.step = 1; saveMenu(); SND.blip(); } return; }
    if (h.act === 'up') bumpLetter(h.slot, 1);
    else if (h.act === 'down') bumpLetter(h.slot, -1);
    else if (h.act === 'box') { M.step = 0; M.slot = h.slot; SND.blip(); }
    else if (h.act === 'ok') { M.step = 1; saveMenu(); SND.blip(); }
    else if (h.act === 'level') { M.sel = h.idx; M.step = 1; startLevel(); }
  }
  cv.addEventListener('pointermove', e => { if (S.mode === 'menu') menuPointerMove(e); });
  cv.addEventListener('pointerup', e => { if (S.mode === 'menu') menuPointerUp(e); });
  cv.addEventListener('pointercancel', () => { drag = null; });
  cv.addEventListener('wheel', e => {
    if (S.mode !== 'menu') return;
    const h = hitAt(toVirtual(e));
    if (h && h.slot !== undefined) { e.preventDefault(); bumpLetter(h.slot, e.deltaY < 0 ? 1 : -1); }
  }, { passive: false });

  function drawHUD(VW, VH) {
    if (S.mode === 'menu') { drawMenu(VW, VH); return; }
    const kmh = Math.max(0, S.v * KMH);
    // panel
    ctx.fillStyle = 'rgba(27,34,48,.82)'; ctx.fillRect(12, 12, 230, 108);
    ctx.textAlign = 'left';
    ctx.fillStyle = C.muted; ctx.font = '600 10px "IBM Plex Mono", monospace';
    ctx.fillText('SPEED', 24, 30); ctx.fillText('ENERGY', 24, 84);
    ctx.fillStyle = C.chalk; ctx.font = '800 italic 40px "Barlow Condensed", sans-serif';
    ctx.fillText(kmh.toFixed(0), 24, 68);
    ctx.font = '600 12px "IBM Plex Mono", monospace'; ctx.fillStyle = C.muted;
    ctx.fillText('km/h', 24 + ctx.measureText('000').width * 2.3, 66);
    // gradient readout
    const gpc = gradeAt(S.x) * 100;
    ctx.textAlign = 'right'; ctx.fillStyle = gpc > 3 ? C.rust : gpc < -3 ? C.green : C.chalk;
    ctx.font = '600 16px "IBM Plex Mono", monospace';
    ctx.fillText(`${gpc >= 0 ? '+' : ''}${gpc.toFixed(0)}%`, 230, 66);
    ctx.fillStyle = C.muted; ctx.font = '600 10px "IBM Plex Mono", monospace'; ctx.fillText('GRADE', 230, 30);
    // energy bar
    ctx.textAlign = 'left';
    ctx.fillStyle = C.slate; ctx.fillRect(24, 92, 206, 12);
    ctx.fillStyle = S.energy < 20 ? C.rust : C.amber; ctx.fillRect(24, 92, 206 * S.energy/100, 12);
    if (S.bonkT > 0 && (performance.now()/150|0)%2) { ctx.strokeStyle = C.rust; ctx.lineWidth = 2; ctx.strokeRect(23, 91, 208, 14); }

    // right panel: time + next roundabout
    const pw = 220, px0 = VW - pw - 12;
    ctx.fillStyle = 'rgba(27,34,48,.82)'; ctx.fillRect(px0, 12, pw, 108);
    ctx.fillStyle = C.muted; ctx.font = '600 10px "IBM Plex Mono", monospace';
    ctx.fillText('TIME', px0 + 12, 30); ctx.fillText('TO FINISH', px0 + 120, 30);
    const nl = LIGHTS.find(l => !l.done);
    ctx.fillText(ROUNDABOUTS.length ? 'NEXT ROUNDABOUT' : nl && (nl.x - S.x) / 10 < 90 ? 'TRAFFIC LIGHT' : 'CLIMB', px0 + 12, 84);
    ctx.fillStyle = C.chalk; ctx.font = '600 18px "IBM Plex Mono", monospace';
    ctx.fillText(fmt(S.time + S.penalty), px0 + 12, 56);
    ctx.fillText(`${Math.max(0, (FINISH - S.x)/10).toFixed(0)} m`, px0 + 120, 56);
    if (S.penalty) { ctx.fillStyle = C.rust; ctx.font = '600 10px "IBM Plex Mono", monospace'; ctx.fillText(`incl. +${S.penalty}s`, px0 + 12, 70); }
    const next = ROUNDABOUTS.find(r => !r.done);
    const nextLight = LIGHTS.find(l => !l.done);
    ctx.font = '600 13px "IBM Plex Mono", monospace';
    if (next) {
      const d = (next.x - next.w/2 - S.x)/10;
      const over = kmh > next.limit;
      ctx.fillStyle = d < 45 && over ? C.rust : C.chalk;
      ctx.fillText(`${d.toFixed(0)} m · limit ${next.limit}`, px0 + 12, 104);
    } else if (nextLight && (nextLight.x - S.x) / 10 < 90) {
      const st = lightState(nextLight).c;
      ctx.fillStyle = LAMP[st]; ctx.font = '600 12px "IBM Plex Mono", monospace';
      ctx.fillText(`Light · ${Math.round((nextLight.x - S.x) / 10)} m · ${st.toUpperCase()}`, px0 + 12, 104);
    } else if (!ROUNDABOUTS.length) {
      const on = CLIMBS.find(c => S.x >= c.x0 && S.x < c.x1);
      const up = CLIMBS.find(c => S.x < c.x0);
      ctx.fillStyle = on ? C.amber : C.chalk; ctx.font = '600 12px "IBM Plex Mono", monospace';
      ctx.fillText(on ? `On ${on.name}` : up ? `${up.name} · ${Math.round((up.x0 - S.x) / 10)} m` : 'Run for the line', px0 + 12, 104);
    } else { ctx.fillStyle = C.green; ctx.fillText('All clear to the line', px0 + 12, 104); }

    // brake warning flash
    if (next && S.mode === 'riding') {
      const d = (next.x - next.w/2 - S.x)/10;
      if (d < 45 && d > 0 && kmh > next.limit && (performance.now()/200|0)%2) {
        ctx.textAlign = 'center'; ctx.fillStyle = C.rust; ctx.font = '800 italic 30px "Barlow Condensed", sans-serif';
        ctx.fillText('BRAKE!  ←', VW/2, 160);
      }
    }

    // traffic light approach warnings
    if (nextLight && S.mode === 'riding' && S.crashT <= 0) {
      const d = (nextLight.x - S.x) / 10, st = lightState(nextLight).c;
      if (d > 0 && d < 50 && st !== 'green' && (performance.now() / 200 | 0) % 2) {
        ctx.textAlign = 'center'; ctx.fillStyle = LAMP[st];
        ctx.font = '800 italic 30px "Barlow Condensed", sans-serif';
        ctx.fillText(st === 'red' ? 'RED LIGHT · STOP  ←' : 'YELLOW · SLOW DOWN', VW / 2, 160);
      }
    }

    // bonk banner
    if (S.bonkT > 0 && S.mode === 'riding') {
      ctx.fillStyle = 'rgba(40,48,40,.28)'; ctx.fillRect(0, 0, VW, VH);
      const jit = (performance.now() / 90 | 0) % 2 ? 2 : -2;
      ctx.textAlign = 'center';
      ctx.font = `44px ${PIX}`;
      ctx.fillStyle = C.rust; ctx.fillText('BONK!', VW / 2 + 4 + jit, 196);
      ctx.fillStyle = C.amber; ctx.fillText('BONK!', VW / 2 + jit, 192);
      ctx.font = `10px ${PIX}`; ctx.fillStyle = C.chalk;
      ctx.fillText(`LEGS GONE · ${BONK_KMH} KM/H · NO STANDING`, VW / 2, 224);
      const bw = 200; ctx.fillStyle = C.slate; ctx.fillRect(VW / 2 - bw / 2, 236, bw, 8);
      ctx.fillStyle = C.amber; ctx.fillRect(VW / 2 - bw / 2, 236, bw * S.bonkT / BONK_TIME, 8);
    }

    // message
    if (S.msgT > 0 && !(S.bonkT > 0)) {
      ctx.textAlign = 'center'; ctx.globalAlpha = Math.min(1, S.msgT);
      ctx.fillStyle = 'rgba(27,34,48,.85)';
      ctx.font = '600 14px "IBM Plex Mono", monospace';
      const tw = ctx.measureText(S.msg).width + 28;
      ctx.fillRect(VW/2 - tw/2, VH - 64, tw, 32);
      ctx.fillStyle = C.chalk; ctx.fillText(S.msg, VW/2, VH - 43);
      ctx.globalAlpha = 1;
    }

    // course profile minimap
    const mw = Math.min(360, VW - 48), mx = VW/2 - mw/2, my = VH - 22;
    ctx.strokeStyle = 'rgba(238,240,234,.45)'; ctx.lineWidth = 1.5; ctx.beginPath();
    const hmin = HMIN, hmax = HMAX;
    for (const c of CLIMBS) { ctx.fillStyle = 'rgba(242,165,65,.6)'; ctx.fillRect(mx + mw * c.x0 / COURSE, my + 2, Math.max(2, mw * (c.x1 - c.x0) / COURSE), 2); }
    for (let i=0;i<=60;i++){ const wx = COURSE*i/60; const y = my - (heightAt(wx)-hmin)/(hmax-hmin)*16; i?ctx.lineTo(mx+mw*i/60,y):ctx.moveTo(mx,y); }
    ctx.stroke();
    for (const r of ROUNDABOUTS) { ctx.fillStyle = r.done ? C.green : C.rust; ctx.fillRect(mx + mw*r.x/COURSE - 1.5, my + 2, 3, 4); }
    for (const L of LIGHTS) { ctx.fillStyle = L.done ? 'rgba(238,240,234,.4)' : LAMP[lightState(L).c]; ctx.fillRect(mx + mw*L.x/COURSE - 2, my + 1, 4, 5); }
    ctx.fillStyle = C.amber; ctx.beginPath(); ctx.arc(mx + mw*S.x/COURSE, my - (heightAt(S.x)-hmin)/(hmax-hmin)*16, 3.5, 0, Math.PI*2); ctx.fill();

    // overlays
    // rider + level tag under the left panel
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(238,240,234,.75)'; ctx.font = `8px ${PIX}`;
    ctx.fillText(`${playerName()} · ${LV.name.toUpperCase()}`, 14, 136);

    if (S.mode === 'ready') overlay(VW, VH, 'Press → to roll out', `${playerName()} on ${LV.name} · ${LV.blurb}`, 'Esc: main menu');
    if (S.mode === 'finished') {
      const final = S.time + S.penalty;
      overlay(VW, VH, S.newBest ? `New best · ${fmt(final)}` : `Finished · ${fmt(final)}`,
        `${playerName()} · ride ${fmt(S.time)} + ${S.penalty}s penalties · ${S.crashes} crash${S.crashes===1?'':'es'} · ${S.bonks} bonk${S.bonks===1?'':'s'}` + (S.best ? ` · Best ${fmt(S.best)}` : ''),
        'Enter or tap: ride again · Esc: main menu');
    }
  }

  function overlay(VW, VH, title, sub, sub2) {
    ctx.fillStyle = 'rgba(27,34,48,.72)'; ctx.fillRect(0, VH*0.32, VW, 120);
    ctx.textAlign = 'center';
    ctx.fillStyle = C.amber; ctx.font = '800 italic 40px "Barlow Condensed", sans-serif';
    ctx.fillText(title.toUpperCase(), VW/2, VH*0.32 + 50);
    ctx.fillStyle = C.chalk; ctx.font = '400 13px "IBM Plex Mono", monospace';
    ctx.fillText(sub, VW/2, VH*0.32 + 78);
    if (sub2) { ctx.fillStyle = C.muted; ctx.fillText(sub2, VW/2, VH*0.32 + 100); }
  }

  // ---- Loop ---------------------------------------------------------------
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(0.1, (now - last) / 1000); last = now;
    while (acc >= 1/120) { update(1/120); acc -= 1/120; }
    for (const k in btns) if (k in keys) btns[k].classList.toggle('on', keys[k]);
    draw();
    requestAnimationFrame(frame);
  }
  snapCam();
  if (document.fonts && document.fonts.load) document.fonts.load(`20px ${PIX}`).catch(() => {});
  cv.focus({ preventScroll: true });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
